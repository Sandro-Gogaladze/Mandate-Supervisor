# The single front door: static console plus a reverse proxy to both backends.

# The eager bundle is 2.6 MB raw and 754 kB gzipped, so this is the single
# biggest thing a first-time visitor feels.
# Standard upgrade map: empty when there is no Upgrade header — which keeps
# SSE on plain keepalive — and "upgrade" when a client asks for WebSockets.
# Hardcoding Connection "" instead would silently foreclose any WebSocket
# transport the CopilotKit client chooses.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

gzip              on;
gzip_types        text/css application/javascript application/json image/svg+xml;
gzip_min_length   1024;
gzip_vary         on;

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # A dossier arrives as a zip of its directory. nginx's 1 MB default would
    # reject submissions before the application's own 16 MB limit — and its
    # specific error message — ever came into play.
    client_max_body_size 100m;

    # REST over the ledger. The trailing slash strips the /api prefix, which
    # mirrors the dev-server rewrite in dashboard/vite.config.ts, so the same
    # frontend code works in both.
    # Buffering stays ON here (better for slow clients on ordinary JSON). The
    # one streaming endpoint under this prefix — the ledger event stream in
    # api/dossiers.py — sets `X-Accel-Buffering: no`, which nginx honours to
    # disable buffering for that response alone. Don't strip that header.
    location /api/ {
        proxy_pass         http://api:8123/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # The agent stream. These four lines are load-bearing, not boilerplate: a
    # case review is a minutes-long SSE response, and nginx's defaults would
    # either hold the tokens back until the run ended or cut the connection
    # mid-stream — the exact failure the runtime's unhandledRejection guard
    # exists to survive.
    location /copilotkit {
        proxy_pass         http://copilot-runtime:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Hashed asset filenames are immutable; index.html must never be.
    location /assets/ {
        expires   1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
