<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Versioned FILENAMES, not "?v=" query strings. Safari keys its
         favicon cache by host and ignores the query string, so a bumped
         "?v=" never dislodges a cached icon there (Chrome and Firefox do
         honour it). A path Safari has never fetched cannot come from that
         cache. Bump the -v9 suffix on every icon change.
         /favicon.ico stays unversioned alongside these: browsers and crawlers
         probe that exact path whether or not a <link> points at it. -->
    <link rel="icon" href="/icon-v9.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/mark-v9.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32-v9.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192-v9.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-v9.png" />
    <meta name="theme-color" content="#003c78" />
    <meta
      name="description"
      content="Continuous supervision of AI payment agents — the National Bank of Georgia's regulator-side console for AP2 mandate chains."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Mandate Supervisor</title>
    <!-- crypto.randomUUID is exposed only in a secure context: HTTPS, or
         localhost (which browsers treat as secure by definition). A console
         served over plain HTTP from a public address is neither, so the case
         room crashed on the first thread id it generated — a failure that
         cannot reproduce in development, because development is always
         localhost. crypto.getRandomValues has no such restriction, so this
         builds the same RFC 4122 v4 value from real randomness rather than
         Math.random. Defined before the app's module script so it covers
         vendor code too, not only our own call site. -->
    <script>
      if (!('randomUUID' in crypto)) {
        crypto.randomUUID = function randomUUID() {
          const b = crypto.getRandomValues(new Uint8Array(16))
          b[6] = (b[6] & 0x0f) | 0x40
          b[8] = (b[8] & 0x3f) | 0x80
          const h = Array.from(b, (x) => x.toString(16).padStart(2, '0')).join('')
          return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
